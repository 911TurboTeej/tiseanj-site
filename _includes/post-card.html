{% assign p = include.post %}
<article class="card" data-cat="{{ p.categories.first | slugify }}">
  {% if p.image %}<a class="card-img" href="{{ p.url | relative_url }}"><img src="{{ p.image | relative_url }}" alt="" loading="lazy"></a>{% endif %}
  {% if p.categories.first %}<p class="tag">{{ p.categories.first }}</p>{% endif %}
  <h3><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
  <p class="excerpt">{{ p.excerpt | strip_html | truncatewords: 24 }}</p>
  <p class="meta">{{ p.date | date: "%m.%d.%Y" }}</p>
</article>
