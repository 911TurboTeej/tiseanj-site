---
layout: default
---
<article class="wrap narrow post">
  {% if page.categories.first %}<p class="tag">{{ page.categories.first }}</p>{% endif %}
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  {% if page.image %}<img class="post-img" src="{{ page.image | relative_url }}" alt="">{% endif %}
  <div class="prose">{{ content }}</div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
