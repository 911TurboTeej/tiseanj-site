---
layout: default
---
<article class="wrap narrow post">
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.categories.size > 0 %} &middot; {{ page.categories | join: ", " }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <div class="prose">{{ content }}</div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
