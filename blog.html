---
layout: default
title: Blog
permalink: /blog/
---
<section class="wrap">
  <h1>Blog</h1>
  <div class="filters" role="group" aria-label="Filter posts by topic">
    <button type="button" data-cat="all" aria-pressed="true">All</button>
    {% for category in site.categories %}<button type="button" data-cat="{{ category[0] | slugify }}" aria-pressed="false">{{ category[0] }}</button>{% endfor %}
  </div>
  <div class="grid">
    {% for post in site.posts %}{% include post-card.html post=post %}{% endfor %}
  </div>
</section>
<script>
document.querySelectorAll('.filters button').forEach(function(b){
  b.addEventListener('click',function(){
    var c=b.dataset.cat;
    document.querySelectorAll('.filters button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
    document.querySelectorAll('.card').forEach(function(card){card.hidden=(c!=='all'&&card.dataset.cat!==c);});
  });
});
</script>
